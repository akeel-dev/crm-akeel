# time.yml — os fatos estruturados do time neste projeto.
# Dono: o humano. O Orquestrador propõe mudanças; o humano escreve ou autoriza.
# Todo agente lê este arquivo antes de escrever qualquer coisa.

projeto: crm-akeel
metodo: time-padrao 0.1.0
modo: leve                    # leve | completo
# Códigos de módulo da spec (§3.1). Confirmado pelo Pedro em 2026-11-24
# (planning/decisoes/2026-11-24.md §5 e §6).
rigor_completo_em: [IAM, USR, TRS, MIG, API, WPP, BIL, LGPD]

idioma:
  prosa: pt-BR
  codigo: en

# A spec é do humano. Nenhum papel a edita.
spec: especificacao-crm-akeel-v1.1.md   # + o estudo em pipedrive/, que a spec cita

comandos:
  # ADR 0001 rev. 2, aceito pelo Pedro em 2026-11-24 (planning/decisoes/2026-11-24.md §10).
  # Sem os dois clones, o JDK 25, o Node e o Docker, a suíte é inexecutável, não vermelha.
  pre_requisito: "test -d backend/.git && test -d frontend/.git && docker info >/dev/null 2>&1 && java -version 2>&1 | grep -q 'version \"25' && node --version | grep -qE '^v(2[2-9]|[3-9][0-9])\\.'"
  # Roda a suíte de cada repositório, depois o que só o raiz enxerga (contrato e backup).
  suite: "(cd backend && ./mvnw -B verify) && (cd frontend && npm ci --no-audit --no-fund && npm test) && cmp backend/openapi/openapi.json frontend/openapi/openapi.json && sh deploy/backup/verificar-portabilidade.sh"
  suite_backend: "cd backend && ./mvnw -B verify"
  suite_frontend: "cd frontend && npm ci --no-audit --no-fund && npm test"
  teste_unico: "(cd backend && ./mvnw -B test -Dtest={classe} -Dsurefire.failIfNoSpecifiedTests=false)"
  teste_unico_frontend: "(cd frontend && npx vitest run {arquivo})"
  arquitetura: "(cd backend && ./mvnw -B test -Dtest='ModularityTest,ArchitectureTest,StorageConfigTest')"

# Onde cada papel escreve. Os caminhos são relativos à raiz deste projeto, mesmo
# dentro dos repositórios de produto (backend/ e frontend/ são repos git próprios,
# ignorados pelo raiz — decisoes/2026-11-24.md §8).
# Regra de sobreposição (decisoes/2026-11-24.md §7): quando dois caminhos casam com o
# mesmo arquivo, o mais específico vence.
escrita:
  orquestrador: [CLAUDE.md, ESTADO.md, COLHEITA.md, planning/FILA.md, planning/roteiro.md, planning/decisoes/**, planning/arquivo/**]
  planejador: [planning/ondas/**, planning/stories/**]
  arquiteto: [docs/adr/**, docs/arquitetura/**, SISTEMA.md,
              backend/src/test/java/br/com/akeel/crm/architecture/**]   # vence backend/src/test/** do QA
  qa: [backend/src/test/**, frontend/test/**, frontend/e2e/**]
  dev: [backend/src/main/**, backend/openapi/**, backend/pom.xml, backend/.mvn/**, backend/mvnw, backend/mvnw.cmd,
        frontend/src/**, frontend/public/**, frontend/openapi/**, frontend/index.html, frontend/package.json,
        frontend/package-lock.json, frontend/vite.config.ts, frontend/vitest.config.ts,
        frontend/tsconfig*.json, frontend/eslint.config.js, frontend/playwright.config.ts]
  revisor: [reviews/**]
  devops: [deploy/**, docs/operacao/**, .github/**, .gitignore, compose.yaml,
           backend/.github/**, backend/Dockerfile, backend/.dockerignore, backend/.gitignore,
           frontend/.github/**, frontend/Dockerfile, frontend/.dockerignore, frontend/.gitignore]
  todos: [conflitos/**]       # qualquer papel abre conflito
  humano: [especificacao-crm-akeel-v1.1.md, pipedrive/**, TIME.md, time.yml, .claude/**]

limites:
  fila_linhas: 300
  estado_linhas: 150
