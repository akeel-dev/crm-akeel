# Dono: DevOps (time.yml, escrita.devops). Story 0-02.
# Ambiente LOCAL de infraestrutura (spec §4.5, ADR 0001): PostgreSQL, Keycloak com o
# realm de teste, Garage (S3) e Mailpit. O backend e o frontend não estão aqui: rodam
# pelo ./mvnw e pelo npm, apontando para estes serviços. Gotenberg fica de fora (0-02,
# "Fora desta story").
#
# Antes da primeira subida: sh deploy/local/gerar-segredos.sh (cria .env e os segredos).
# Como usar: docs/operacao/ambiente-local.md
#
# Nenhum valor de segredo aqui: só referências a arquivos de segredo do Docker
# (deploy/local/secrets/, ignorado pelo git; RF-SEC-03). Nenhum nome de realm fixo:
# vem de KEYCLOAK_REALM (.env).

name: crm-akeel

services:
  postgres:
    image: crm-akeel/postgres:18.7-pgbackrest-2.60.1
    build:
      context: ./deploy
      dockerfile: postgres/Dockerfile
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=crm-pgbackrest archive-push %p
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_MODO: ${BACKUP_MODO-desenvolvimento}
    secrets: [postgres_password, crm_db_password, keycloak_db_password, backup]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres/10-bancos.sh:/docker-entrypoint-initdb.d/10-bancos.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Por TCP: o servidor temporário da inicialização só escuta no socket, então
      # isto só passa depois que os bancos foram criados.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d keycloak && pg_isready -h 127.0.0.1 -U postgres -d crm"]
      interval: 2s
      timeout: 5s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/opt/crm/keycloak-entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?defina KEYCLOAK_REALM no .env (sh deploy/local/gerar-segredos.sh)}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?defina KEYCLOAK_ADMIN_USER no .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - crm_bff_client_secret
      - crm_api_client_secret
      - test_user_password
    volumes:
      - ./deploy/local/keycloak-entrypoint.sh:/opt/crm/keycloak-entrypoint.sh:ro
      - ./deploy/keycloak/realm-crm-local.json:/opt/keycloak/data/import/realm-crm-local.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl; o bash abre o TCP da porta de gestão (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  garage:
    image: dxflrs/garage:v2.5.0
    secrets: [garage_rpc_secret, garage_admin_token]
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Inicializa o Garage (layout, bucket, chave) e fica parado; "healthy" quando terminou.
  garage-init:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "/opt/crm/init.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:?defina S3_BUCKET no .env}
    secrets: [garage_admin_token, garage_s3_access_key_id, garage_s3_secret_access_key]
    volumes:
      - ./deploy/garage/init.sh:/opt/crm/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/pronto"]
      interval: 2s
      timeout: 3s
      retries: 30

  backup-arquivos:
    image: rclone/rclone:1.76.0
    profiles: [backup]
    entrypoint: ["sh", "/opt/crm/backup/arquivos.sh"]
    environment:
      ORIGEM_S3_ENDPOINT: http://garage:3900
      ORIGEM_S3_REGION: garage
      ORIGEM_S3_BUCKET: ${S3_BUCKET:?defina S3_BUCKET no .env}
    secrets: [garage_s3_access_key_id, garage_s3_secret_access_key, backup]
    volumes:
      - ./deploy/backup:/opt/crm/backup:ro
    depends_on:
      garage-init:
        condition: service_healthy

  garage-destino:
    image: dxflrs/garage:v2.5.0
    profiles: [backup-teste]
    secrets: [garage_rpc_secret, garage_admin_token]
    volumes:
      - ./deploy/backup/teste/garage-destino.toml:/etc/garage.toml:ro
      - garage-destino-meta:/var/lib/garage/meta
      - garage-destino-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  backup-destino:
    image: caddy:2.11.9-alpine
    profiles: [backup-teste]
    volumes:
      - ./deploy/backup/teste/Caddyfile:/etc/caddy/Caddyfile:ro
      - backup-destino-caddy:/data
    depends_on:
      garage-destino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-s", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

secrets:
  postgres_password:
    file: ./deploy/local/secrets/postgres_password
  crm_db_password:
    file: ./deploy/local/secrets/crm_db_password
  keycloak_db_password:
    file: ./deploy/local/secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./deploy/local/secrets/keycloak_admin_password
  crm_bff_client_secret:
    file: ./deploy/local/secrets/crm_bff_client_secret
  crm_api_client_secret:
    file: ./deploy/local/secrets/crm_api_client_secret
  test_user_password:
    file: ./deploy/local/secrets/test_user_password
  garage_rpc_secret:
    file: ./deploy/local/secrets/garage_rpc_secret
  garage_admin_token:
    file: ./deploy/local/secrets/garage_admin_token
  garage_s3_access_key_id:
    file: ./deploy/local/secrets/garage_s3_access_key_id
  garage_s3_secret_access_key:
    file: ./deploy/local/secrets/garage_s3_secret_access_key
  backup:
    file: ${BACKUP_SEGREDOS:-./deploy/backup/sem-destino}

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  garage-destino-meta:
  garage-destino-data:
  backup-destino-caddy:
