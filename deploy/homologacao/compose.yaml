services:
  worker:
    environment:
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"

  postgres:
    image: crm-akeel/postgres:18.7-pgbackrest-2.60.1
    build:
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, crm_db_password, keycloak_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./local/postgres/10-bancos.sh:/docker-entrypoint-initdb.d/10-bancos.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d keycloak && pg_isready -h 127.0.0.1 -U postgres -d crm"]
      interval: 2s
      timeout: 5s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/opt/crm/keycloak-entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "18180"
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - crm_bff_client_secret
      - crm_api_client_secret
      - test_user_password
    volumes:
      - ./local/keycloak-entrypoint.sh:/opt/crm/keycloak-entrypoint.sh:ro
      - ./keycloak/realm-crm-local.json:/opt/keycloak/data/import/realm-crm-local.json:ro
    networks:
      default:
        aliases: [keycloak.localhost]
    ports:
      - "127.0.0.1:18180:18180"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  garage:
    image: dxflrs/garage:v2.5.0
    secrets: [garage_rpc_secret, garage_admin_token]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  garage-init:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "/opt/crm/init.sh"]
    environment:
      S3_BUCKET: ${CRM_STORAGE_BUCKET:?}
    secrets: [garage_admin_token, garage_s3_access_key_id, garage_s3_secret_access_key]
    volumes:
      - ./garage/init.sh:/opt/crm/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/pronto"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

secrets:
  postgres_password:
    file: ${CRM_SEGREDOS:?}/postgres_password
  keycloak_db_password:
    file: ${CRM_SEGREDOS:?}/keycloak_db_password
  keycloak_admin_password:
    file: ${CRM_SEGREDOS:?}/keycloak_admin_password
  crm_api_client_secret:
    file: ${CRM_SEGREDOS:?}/crm_api_client_secret
  test_user_password:
    file: ${CRM_SEGREDOS:?}/test_user_password
  garage_rpc_secret:
    file: ${CRM_SEGREDOS:?}/garage_rpc_secret
  garage_admin_token:
    file: ${CRM_SEGREDOS:?}/garage_admin_token

volumes:
  postgres-data:
  garage-meta:
  garage-data:
