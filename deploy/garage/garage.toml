# Dono: DevOps (time.yml, escrita.devops). Story 0-02, critério 4.
# Garage local, nó único (ADR 0001, decisão 5: replication_factor = 1).
# Os segredos vêm de arquivos de segredo do Docker; nenhum valor aqui.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"

# Os segredos locais ficam 644 dentro de deploy/local/secrets/ (700), para que
# contêineres com outro uid os leiam. Só vale para o ambiente local.
allow_world_readable_secrets = true

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/run/secrets/garage_admin_token"
