name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  manifesto:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.tags.outputs.backend }}
      frontend: ${{ steps.tags.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: tags
        name: Tags do manifesto
        run: |
          . deploy/manifesto.env
          echo "backend=$CRM_BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend=$CRM_FRONTEND_TAG" >> "$GITHUB_OUTPUT"

  contrato:
    needs: manifesto
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akeel-dev/crm-akeel-backend
          ref: ${{ needs.manifesto.outputs.backend }}
          token: ${{ secrets.CRM_PRODUTOS_LEITURA }}
          path: backend
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akeel-dev/crm-akeel-frontend
          ref: ${{ needs.manifesto.outputs.frontend }}
          token: ${{ secrets.CRM_PRODUTOS_LEITURA }}
          path: frontend
          persist-credentials: false

      - name: Contrato OpenAPI
        run: sh deploy/contrato.sh

  homologacao:
    needs: [manifesto, contrato]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akeel-dev/crm-akeel-backend
          ref: ${{ needs.manifesto.outputs.backend }}
          token: ${{ secrets.CRM_PRODUTOS_LEITURA }}
          path: backend
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akeel-dev/crm-akeel-frontend
          ref: ${{ needs.manifesto.outputs.frontend }}
          token: ${{ secrets.CRM_PRODUTOS_LEITURA }}
          path: frontend
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Imagens do manifesto
        run: sh deploy/imagens.sh

      - name: Segredos falsos da homologacao local
        run: sh deploy/local/gerar-segredos.sh

      - name: Deploy na homologacao local
        run: sh deploy/deploy.sh homologacao-local

      - name: Dependencias do e2e
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: E2e contra a homologacao
        run: sh deploy/homologacao/e2e.sh

      - name: Logs da homologacao
        if: failure()
        run: docker compose -p crm-akeel-homologacao logs --no-color --tail 200

  producao:
    needs: [manifesto, homologacao]
    runs-on: [self-hosted, crm-producao]
    timeout-minutes: 30
    environment:
      name: producao
      url: https://crm.akeel.com.br
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akeel-dev/crm-akeel-backend
          ref: ${{ needs.manifesto.outputs.backend }}
          token: ${{ secrets.CRM_PRODUTOS_LEITURA }}
          path: backend
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akeel-dev/crm-akeel-frontend
          ref: ${{ needs.manifesto.outputs.frontend }}
          token: ${{ secrets.CRM_PRODUTOS_LEITURA }}
          path: frontend
          persist-credentials: false

      - name: Imagens do manifesto
        run: sh deploy/imagens.sh

      - name: Deploy em producao
        run: sh deploy/deploy.sh producao
